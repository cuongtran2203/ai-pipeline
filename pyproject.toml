[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-pipeline"
version = "0.4.1"
description = "Multi-agent AI project workflow (spec -> plan -> parallel execution) for Claude Code / Codex, orchestrated by Orca. `ai-pipeline init` installs it into any project."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []

[project.scripts]
ai-pipeline = "ai_pipeline.cli:main"

[tool.setuptools]
packages = ["ai_pipeline"]
include-package-data = true

[tool.setuptools.package-data]
ai_pipeline = ["payload/**/*", "payload/*"]
